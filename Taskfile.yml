# https://taskfile.dev

version: "3"

tasks:
  default:
    cmds:
      - task: setup
      - task: format
      - task: lint
      - task: build
      - task: unit-test
      - task: integration-test
    silent: true

  setup:
    run: once
    cmds:
      - ./scripts/setup.sh

  format:
    run: once
    cmds:
      - ./scripts/format.sh

  lint:
    run: once
    cmds:
      - ./scripts/lint.sh

  build:
    run: once
    cmds:
      - ./scripts/build.sh

  unit-test:
    run: once
    cmds:
      - ./scripts/unit-test.sh

  integration-test:
    run: once
    deps:
      - build
    cmds:
      - task: start-local-instance
      - defer: { task: stop-local-instance }
      - ./scripts/integration-test.sh

  start-local-instance:
    desc: Start a local Lambda instance for testing
    run: once
    cmds:
      - ./scripts/local-instance.sh start lambda-application:$(./scripts/get-version.sh)

  stop-local-instance:
    desc: Stop the local Lambda instance
    run: once
    cmds:
      - ./scripts/local-instance.sh stop lambda-application:$(./scripts/get-version.sh)
